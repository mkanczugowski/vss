# Installation target
#   true   — install into the shared systemwide OpenFOAM directories (FOAM_APPBIN / FOAM_LIBBIN),
#             accessible to all users on the system; requires write permission to those paths
#   false  — install into the current user's OpenFOAM directories (FOAM_USER_APPBIN / FOAM_USER_LIBBIN),
#             no elevated permissions needed
installGlobal=false

# Library type produced by the build
#   libso  — shared library (.so), loaded at runtime by OpenFOAM solvers (recommended)
#   lib    — static library (.a), linked into the binary at compile time
makeType=libso

# Compiler optimisation mode
#   opt    — optimised binary, fast execution, no debug symbols (for production runs)
#   debug  — no optimisation (-O0), full debug symbols (-g), extra runtime checks (-DFULLDEBUG)
buildMode=opt

# Number of CPU cores used for parallel compilation (set to number of available cores)
noCompileCPU=4


